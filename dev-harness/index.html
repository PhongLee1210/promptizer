<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Promptizer chip harness</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #faf9f7;
        color: #141413;
      }
      header {
        padding: 12px 20px;
        border-bottom: 1px solid #e6e3df;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        font-size: 13px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 24px;
      }
      .composer {
        max-width: 760px;
        width: 100%;
        margin: 0 auto;
        border: 1px solid #d8d4ce;
        border-radius: 16px;
        background: #ffffff;
        padding: 12px 14px 44px;
        box-shadow: 0 2px 10px rgb(20 20 19 / 0.06);
        position: relative;
      }
      textarea {
        width: 100%;
        border: 0;
        outline: none;
        resize: none;
        font: inherit;
        font-size: 15px;
        line-height: 1.5;
        background: transparent;
      }
      .send {
        position: absolute;
        right: 12px;
        bottom: 10px;
        border: 0;
        border-radius: 10px;
        background: #141413;
        color: #ffffff;
        font-size: 13px;
        padding: 6px 12px;
        cursor: pointer;
      }
      #top-composer {
        margin-bottom: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <label>
        Model answer
        <select id="outcome">
          <option value="refine">refine (suggestion)</option>
          <option value="same">refine, same as draft</option>
          <option value="keep">keep</option>
          <option value="error">error</option>
        </select>
      </label>
      <label>
        Delay
        <select id="delay">
          <option value="300">300ms</option>
          <option value="4000">4s (slow)</option>
          <option value="0">instant</option>
        </select>
      </label>
      <span id="log"></span>
    </header>
    <main>
      <div class="composer" id="top-composer">
        <textarea rows="2" placeholder="Composer near the top of the page"></textarea>
        <button class="send" type="button">Send</button>
      </div>
      <div class="composer">
        <textarea rows="3" placeholder="Message the model…">
make a landing page for my coffee shop, modern, with menu</textarea>
        <button class="send" type="button">Send</button>
      </div>
    </main>
    <script>
      // Outside a real extension context there is no chrome.runtime; this harness
      // runs the content-script controller directly in a plain tab, so stub just
      // enough of chrome.runtime.getURL for the chip's logo image to resolve.
      window.chrome ??= {};
      window.chrome.runtime ??= {};
      window.chrome.runtime.getURL ??= (path) => path;
      // Minimal storage.local + onChanged so the chip's "Turn off" rail item and its
      // storage-driven sync with the popup's power toggle work in this standalone harness.
      const storageListeners = [];
      const storageData = {};
      window.chrome.storage ??= {
        local: {
          get: async (key) => ({ [key]: storageData[key] }),
          set: async (obj) => {
            const changes = {};
            for (const [key, newValue] of Object.entries(obj)) {
              changes[key] = { oldValue: storageData[key], newValue };
              storageData[key] = newValue;
            }
            storageListeners.forEach((fn) => fn(changes, "local"));
          },
        },
        onChanged: {
          addListener: (fn) => storageListeners.push(fn),
          removeListener: (fn) => storageListeners.splice(storageListeners.indexOf(fn), 1),
        },
      };
      // Force an open shadow root so this harness page's own devtools/automation
      // can inspect the chip's internals; the shipped extension still uses "closed".
      const realAttachShadow = Element.prototype.attachShadow;
      Element.prototype.attachShadow = function (init) {
        return realAttachShadow.call(this, { ...init, mode: "open" });
      };
    </script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
