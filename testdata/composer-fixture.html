<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Promptizer composer fixture</title>
  <style>
    body { max-width: 760px; margin: 40px auto; padding: 0 20px; font: 16px/1.5 system-ui,sans-serif; }
    #prompt-textarea { min-height: 140px; padding: 16px; border: 2px solid #64748b; border-radius: 12px; }
  </style>
</head>
<body>
  <h1>Composer fixture</h1>
  <p>Type a draft, then use the injected <strong>Refine draft</strong> button. Add <code>?mode=live</code> to this fixture URL to exercise the opt-in inline suggestion. The mock extension runtime returns a deterministic preview and never sends data.</p>
  <div id="prompt-textarea" contenteditable="true" role="textbox">make contact button sticky but dont change existing design</div>
  <script>
    const listeners = [];
    const fixtureMode = new URLSearchParams(location.search).get("mode") === "live" ? "live" : "manual";
    window.chrome = {
      storage: { local: { get: async (defaults) => ({ ...defaults, enabled: true, mode: fixtureMode, taskSummary: "Fixture task" }) } },
      runtime: {
        onMessage: { addListener: (listener) => listeners.push(listener) },
        sendMessage: async (message) => message.type === "PROMPTIZER_REFINE" ? { ok: true, data: { request_id: message.payload.request_id, decision: "refine", refined_prompt: "Make the existing contact button remain visible while scrolling without changing the current design.", model: "fixture", cached: false } } : { ok: true }
      }
    };
    window.PromptizerAdapters = [{ id: "fixture", matches: () => true, findComposer: () => document.querySelector("#prompt-textarea"), selectedTurns: () => "" }];
  </script>
  <script src="../extension/core.js"></script>
  <script src="../extension/content.js"></script>
</body>
</html>
